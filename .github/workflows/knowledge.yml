name: Knowledge database and service
on:
  pull_request:
    paths: ['knowledge/**', 'app/shared/knowledge.ts', 'app/shared/catalog.ts', 'app/server/knowledge-identity.ts', 'scripts/smoke.mjs', '.github/workflows/knowledge.yml', 'package.json', 'package-lock.json']
  push:
    branches: [main]
    paths: ['knowledge/**', 'app/shared/knowledge.ts', 'app/shared/catalog.ts', 'app/server/knowledge-identity.ts', 'scripts/smoke.mjs', '.github/workflows/knowledge.yml', 'package.json', 'package-lock.json']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run knowledge:check
      - run: npm run knowledge:test
      - run: npm run knowledge:build
        env:
          WRANGLER_SEND_METRICS: 'false'
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    concurrency:
      group: commie-knowledge-operations
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Wait for the independently checked personnel identity bridge
        run: node knowledge/scripts/ensure-identity.mjs --env production
      - name: Prepare the staging identity bridge if missing
        run: node knowledge/scripts/ensure-identity.mjs --env staging
      - name: Provision, back up, migrate, release and verify staging
        run: node knowledge/scripts/release.mjs --env staging
      - name: Freeze, import, verify and switch staging resource authority
        run: node knowledge/scripts/cutover-resources.mjs --env staging
      - name: Provision, back up, migrate, release and verify production
        run: node knowledge/scripts/release.mjs --env production
      - name: Freeze, import, verify and switch production resource authority
        run: node knowledge/scripts/cutover-resources.mjs --env production
      - name: Import supplied private drafts without publishing
        run: node knowledge/scripts/import-drafts.mjs
        env:
          KNOWLEDGE_INITIAL_DRAFTS: ${{ secrets.KNOWLEDGE_INITIAL_DRAFTS }}
